[package]
name = "real-multibatch-bench"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
taper-hashmap = { path = "vendor/taper-hashmap" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
hashbrown = "0.15"
rand_mt = "4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[[bench]]
name = "real_multibatch_varchar"
harness = false
